# Catálogo de modelos do gateway de IA (PoC)
# Três camadas: fronteira (SaaS), local (soberania) e simulado (resiliência da demo)

model_list:
  # Camada 1 — modelo de fronteira via provedor SaaS (requer ANTHROPIC_API_KEY no .env)
  - model_name: fronteira-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Modelo de fronteira (SaaS) — perfil padrão de desenvolvimento"

  - model_name: fronteira-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.000001    # US$ 1,00 / 1M tokens (platform.claude.com, 2026-09-10)
      output_cost_per_token: 0.000005   # US$ 5,00 / 1M tokens
    model_info:
      description: "Modelo de fronteira econômico (SaaS) — tarefas simples; preço registrado explicitamente para FinOps fiel"

  - model_name: fronteira-gpt-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
      input_cost_per_token: 0.00000005  # US$ 0,05 / 1M tokens (developers.openai.com, 2026-09-10)
      output_cost_per_token: 0.0000004  # US$ 0,40 / 1M tokens
    model_info:
      description: "OpenAI mais barato (gpt-5-nano) — preço registrado explicitamente para FinOps fiel"

  # Camada 1 — DeepSeek (SaaS, API própria do provedor). Registrado em 2026-09-25
  # com os IDs reais retornados por GET https://api.deepseek.com/models
  # (`deepseek-flash` = DeepSeek-V4.1-Flash, `deepseek-v4-pro` = DeepSeek-V4-Pro;
  # ambos com janela de 1M tokens). Sem `input_cost_per_token` explícito de
  # propósito: diferente de fronteira-haiku/fronteira-gpt-nano, o mapa nativo do
  # LiteLLM já traz preço para `deepseek/deepseek-flash` (US$ 0,30/1,20 por 1M
  # in/out) e `deepseek/deepseek-v4-pro` (US$ 1,32/3,96) — conferido em
  # litellm.model_cost dentro do container, então o FinOps já sai fiel.
  # ATENÇÃO DE GOVERNANÇA: provedor sediado fora do país — o dado sai da
  # organização E da jurisdição brasileira. Mesma restrição de uso do sandbox
  # OpenRouter: apenas dados públicos/teste, nunca dado de cliente ou PII.
  - model_name: fronteira-deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      description: "DeepSeek-V4.1-Flash (SaaS, 1M ctx, texto+imagem) — APENAS dados públicos; provedor fora da jurisdição brasileira"

  - model_name: fronteira-deepseek-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      description: "DeepSeek-V4-Pro (SaaS, 1M ctx, texto) — APENAS dados públicos; provedor fora da jurisdição brasileira"

  # Camada 2 — modelos locais on-premises (dado não sai do ambiente)
  - model_name: local-hermes
    litellm_params:
      model: openai/hermes-local
      api_base: http://host.docker.internal:8090/v1
      api_key: "local"
    model_info:
      description: "Modelo aberto (~34B) servido no host via llama.cpp — eixo de soberania de dados"

  - model_name: local-qwen
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://ollama:11434
    model_info:
      description: "Modelo aberto rodando local — eixo de soberania de dados"

  # Camada 2 — embeddings locais para o cenário de vector stores (avaliação)
  - model_name: embedding-nomic
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
    model_info:
      description: "Embeddings locais (Ollama) — base do vector store soberano"
      mode: embedding

  # Sandbox — modelos free da OpenRouter (custo zero; SaaS sem soberania — ver
  # benchmark de gateways). Apenas para dados públicos/testes. Lista obtida em
  # 2026-09-10 via https://openrouter.ai/api/v1/models (pricing.prompt/completion
  # == "0"); excluídos google/lyria-* (áudio/música, não é chat) e o meta
  # `openrouter/free` (não é um modelo real).
  #
  # Revalidação 2026-09-25 (chamada real a cada um dos 18): 14 responderam,
  # 4 estão indisponíveis e ficam registrados aqui como evidência de que o
  # catálogo de um gateway apodrece sem revalidação periódica —
  #   * nex-agi/nex-n2.5-mini:free e nex-n2.5-pro:free → 404 "No endpoints
  #     found": descatalogados pela OpenRouter, o ID não existe mais;
  #   * thinkingmachines/inkling:free e inkling-small:free → 403 "only
  #     available on agentic harnesses": política do provedor mudou, o
  #     modelo existe mas não é chamável por API genérica.
  # Entre os 14 que funcionam, gemma-26b, gemma-31b e laguna-s devolveram 429
  # intermitente (limite de taxa do tier free) — alternaram entre 200 e 429 em
  # duas varreduras consecutivas; não é defeito de config, é o free tier.
  - model_name: sandbox-nex-mini
    litellm_params:
      model: openrouter/nex-agi/nex-n2.5-mini:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      description: "Sandbox OpenRouter (free) — APENAS dados públicos; SaaS sem soberania (ver benchmark de gateways)"

  - model_name: sandbox-nex-pro
    litellm_params:
      model: openrouter/nex-agi/nex-n2.5-pro:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      description: "Sandbox OpenRouter (free) — APENAS dados públicos; SaaS sem soberania (ver benchmark de gateways)"

