  # Camada 3 — endpoint simulado (demo funciona sem nenhum provedor)
  - model_name: simulado
    litellm_params:
      model: openai/simulado
      api_key: "mock"
      mock_response: "Resposta simulada pelo gateway de IA da PoC — nenhum modelo real foi chamado. Esta chamada foi autenticada, autorizada, contabilizada e registrada para auditoria."
      # Custo fictício para demonstrar controle de orçamento sem gasto real
      input_cost_per_token: 0.02
      output_cost_per_token: 0.02
    model_info:
      description: "Endpoint simulado — resiliência da demonstração"

# Avaliação: cenário 01 — guardrails Presidio auto-hospedados (P5, P6).
# default_on: false nos dois para não afetar a demo básica da PoC.
guardrails:
  - guardrail_name: "mascara-pii"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000
      presidio_ad_hoc_recognizers: "/app/reconhecedor-cpf.json"
      default_on: false
  - guardrail_name: "mascara-pii-log"
    litellm_params:
      guardrail: presidio
      mode: "logging_only"
      presidio_analyzer_api_base: http://presidio-analyzer:3000
      presidio_anonymizer_api_base: http://presidio-anonymizer:3000
      default_on: false

# Avaliação: cenário 02 — guardrail policies (P5, P10).
# protecao-total herda de protecao-base e adiciona o guardrail pre_call.
policies:
  protecao-base:
    guardrails:
      add: [mascara-pii-log]
  protecao-total:
    inherit: protecao-base
    guardrails:
      add: [mascara-pii]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true

# Avaliação: cenário 03 — MCP Gateway (P1, P4, P5).
# deepwiki é um servidor MCP público sem autenticação, usado apenas como alvo
# funcional do teste de gateway; em produção o registro seria de servidores
# MCP internos — a capacidade avaliada (registro, permissão, auditoria) é a
# mesma.
mcp_servers:
  deepwiki:
    url: "https://mcp.deepwiki.com/mcp"
    transport: "http"

# Avaliação: cenário 04 — Vector Stores (P3, P6). Store soberano: embeddings
# Ollama (embedding-nomic) + pgvector local via o conector litellm-pgvector.
# vector_store_id é o UUID real gerado pelo conector na criação do store
# (POST direto ao conector — o gateway não tem como pré-atribuir um ID
# amigável). Este UUID é mantido em sincronia com o store real pelo script
# `avaliacao/cenarios/04-vector-stores/setup.sh` (idempotente: extensão
# vector, migração de schema, ajuste de dimensão do vetor, criação/reuso do
# store e, se o UUID divergir, atualização automática desta linha + restart
# do gateway) — rode-o após qualquer `db-vectors` novo/recriado; sequência
# completa documentada no README do cenário, §3.1. custom_llm_provider é
# "pg_vector" (com underscore) — o rascunho do brief tinha "pgvector", que
# não existe no enum de provedores do LiteLLM (conferido no código-fonte do
# gateway, litellm.LlmProviders).
vector_store_registry:
  - vector_store_name: "base-governanca"
    litellm_params:
      vector_store_id: "3b36b13f-3c49-4142-9b71-91deff246264"
      custom_llm_provider: "pg_vector"
      api_base: "http://vector-connector:8000"
      api_key: os.environ/LITELLM_MASTER_KEY
      vector_store_description: "Base de conhecimento de governança (soberana: pgvector local + embeddings Ollama)"

# Avaliação: cenário 06 — Agentes A2A e Tool Calling (P1, P3, P4, P5).
# agente-eco é um agente A2A mínimo local, implementação própria (stdlib
# Python, sem a2a-sdk — ver avaliacao/cenarios/06-agentes-tools/dados/agente-eco/server.py
# para a nota sobre a incompatibilidade do a2a-sdk Python encontrada na
# avaliação), somente leitura (responde perguntas citando 3 regras fixas de
# política, sem ações de escrita). Para agentes declarados aqui no config, o
# LiteLLM NÃO busca o agent card do upstream: ele serve `agent_card_params`
# diretamente (apenas reescrevendo `url` para o proxy) — confirmado lendo
# `litellm/proxy/agent_endpoints/a2a_endpoints.py` (`get_agent_card`) dentro
# do container do gateway. `cost_per_query` habilita o rastreio de custo por
# invocação (AG-04) via `litellm/a2a_protocol/cost_calculator.py`.
agents:
  - agent_name: eco-governanca
    agent_card_params:
      protocolVersion: "0.3"
      name: "Eco de Governança"
      description: "Agente A2A local, somente leitura, que responde perguntas citando regras fixas de política de governança de IA."
      url: "http://agente-eco:9000/"
      version: "1.0.0"
      capabilities: {}
      defaultInputModes: ["text"]
      defaultOutputModes: ["text"]
      skills:
        - id: "consulta-politica"
          name: "Consulta de política"
          description: "Responde perguntas citando regras fixas de política de governança de IA (somente leitura)."
          tags: ["governanca"]
    litellm_params:
      cost_per_query: 0.001
